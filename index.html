<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finap — Design System</title>
  </head>
  <body>
    <finap-container>
      <finap-heading level="1">Finap Design System</finap-heading>
      <finap-text>Componentes base construidos con Lit y tokens de diseño.</finap-text>

      <finap-heading level="2">Botones</finap-heading>
      <finap-button>Primario</finap-button>
      <finap-button variant="secondary">Secundario</finap-button>
      <finap-button variant="text">Texto</finap-button>
      <finap-button disabled>Deshabilitado</finap-button>

      <finap-heading level="2">Tarjeta</finap-heading>
      <finap-card>
        <finap-heading level="3">Tarjeta de ejemplo</finap-heading>
        <finap-text>Contenido proyectado en el slot de la tarjeta.</finap-text>
      </finap-card>

      <finap-heading level="2">Iconos</finap-heading>
      <finap-icon name="home"></finap-icon>
      <finap-icon name="settings"></finap-icon>
      <finap-icon name="arrow-right"></finap-icon>
    </finap-container>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
